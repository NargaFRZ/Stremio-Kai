name: Stremio-Kai Discord Windows portable

on:
  push:
    branches: [codex/discord-media-title]
    paths: ['build/discord/**', 'build/windows/**', 'tests/**', '.github/workflows/discord-windows.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Restore compiled build dependencies
        id: dependencies
        uses: actions/cache/restore@v4
        with:
          path: .vcpkg-cache
          key: kai-vcpkg-v1-${{ runner.os }}-${{ hashFiles('build/windows/pins.json', 'build/windows/prepare.py') }}
      - name: Create build dependency cache
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
      - name: Build and test existing Kai portable
        shell: pwsh
        run: ./build/windows/build-portable.ps1
      - name: Upload portable, source, and checksums
        uses: actions/upload-artifact@v4
        with:
          name: Stremio-Kai-4.8.0-RPC-Windows-x64
          path: |
            dist-rpc/*.zip
            dist-rpc/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Retain original native binaries for build diagnosis
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-identity-diagnostics
          path: |
            .build-rpc/kai-original/**/stremio.exe
            .build-rpc/community-original/**/stremio.exe
            .build-rpc/portable-smoke/*.log
            .build-rpc/portable-smoke/app/portable_config/errors-*.txt
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
      - name: Save compiled build dependencies
        if: always() && steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .vcpkg-cache
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
